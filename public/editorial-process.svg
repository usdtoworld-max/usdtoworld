<svg width="480" height="280" viewBox="0 0 480 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="editorial-process-title">
  <title id="editorial-process-title">UsdtoWorld editorial process: source live rates, review by the editorial team, publish and correct openly</title>
  <rect width="480" height="280" rx="20" fill="#f5f8fc"/>

  <!-- Step 1: Source -->
  <g transform="translate(30,60)">
    <circle cx="60" cy="60" r="52" fill="#ffffff" stroke="#3167e8" stroke-width="2.5"/>
    <path d="M40 66c0-13 9-22 20-22s20 9 20 22" stroke="#3167e8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="44" r="10" fill="none" stroke="#3167e8" stroke-width="3"/>
    <text x="60" y="132" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Source</text>
    <text x="60" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5b6472">Live market rate feed</text>
  </g>

  <path d="M150 100 L200 100" stroke="#c7d2e3" stroke-width="2" stroke-dasharray="4 5"/>
  <path d="M195 94 L204 100 L195 106" stroke="#c7d2e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2: Review -->
  <g transform="translate(210,60)">
    <circle cx="60" cy="60" r="52" fill="#ffffff" stroke="#3167e8" stroke-width="2.5"/>
    <rect x="34" y="34" width="52" height="52" rx="6" fill="none" stroke="#3167e8" stroke-width="3"/>
    <path d="M44 60l10 10 20-22" stroke="#3167e8" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="132" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Review</text>
    <text x="60" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5b6472">Editorial team check</text>
  </g>

  <path d="M330 100 L380 100" stroke="#c7d2e3" stroke-width="2" stroke-dasharray="4 5"/>
  <path d="M375 94 L384 100 L375 106" stroke="#c7d2e3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3: Publish -->
  <g transform="translate(390,60)">
    <circle cx="60" cy="60" r="52" fill="#3167e8"/>
    <path d="M38 62l16 16 28-32" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="132" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Publish</text>
    <text x="60" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5b6472">Corrected openly</text>
  </g>
</svg>
